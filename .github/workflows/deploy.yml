name: Pure DevOps CI/CD - Microservices to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write  # Allows pushing to GitHub Container Registry (100% Free!)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Compile and Test Catalog Service
      - name: Build Catalog Service
        run: |
          cd microservices/catalog-service
          dotnet build --configuration Release

      # 3. Compile and Test Order Service
      - name: Build Order Service
        run: |
          cd microservices/order-service
          dotnet build --configuration Release

      # 4. Log in to GitHub Container Registry (ghcr.io - 100% Free!)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and Push Docker Images to ghcr.io
      - name: Build & Push Images
        run: |
          # Convert username to lowercase (required by Docker tags)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Catalog API
          docker build -t ghcr.io/$OWNER/catalog-api:${{ github.sha }} -t ghcr.io/$OWNER/catalog-api:latest ./microservices/catalog-service
          docker push ghcr.io/$OWNER/catalog-api:${{ github.sha }}
          docker push ghcr.io/$OWNER/catalog-api:latest

          # Order API
          docker build -t ghcr.io/$OWNER/order-api:${{ github.sha }} -t ghcr.io/$OWNER/order-api:latest ./microservices/order-service
          docker push ghcr.io/$OWNER/order-api:${{ github.sha }}
          docker push ghcr.io/$OWNER/order-api:latest

      # 6. Azure Authentication (Passwordless via OIDC / Managed Identity)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 7. Zero-Downtime Deployment to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          az containerapp update \
            --name catalog-api \
            --resource-group GST \
            --image ghcr.io/$OWNER/catalog-api:${{ github.sha }}

          az containerapp update \
            --name order-api \
            --resource-group GST \
            --image ghcr.io/$OWNER/order-api:${{ github.sha }}
